<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0d1a2b">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="競技史DB">
  <meta name="description" content="タイトル・大会・リーグ・執行部の歴史を記録する個人用アーカイブ">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="apple-touch-icon" href="icon-180.png">
  <link rel="stylesheet" href="./history-style.css?v=0.7.5">
  <title>競技史アーカイブ</title>
  <style>
    :root { color-scheme:dark; --bg:#091420; --surface:#102133; --panel:#14283d; --border:#2b4256; --text:#f3f5f9; --sub:#9fb0c3; --muted:#71869c; --gold:#e7bf70; --gold2:#fbdfad; --blue:#79c7ea; --red:#ff958e; --green:#9bddad; --shadow:0 14px 40px rgba(0,0,0,.23); }
    *{box-sizing:border-box}
    body{margin:0;min-width:310px;font-family:-apple-system,BlinkMacSystemFont,"Hiragino Kaku Gothic ProN","Yu Gothic",Meiryo,sans-serif;background:radial-gradient(ellipse at 85% -20%,#203951 0,transparent 45%),var(--bg);color:var(--text);line-height:1.55;padding-bottom:env(safe-area-inset-bottom)}
    button,input,select,textarea{font:inherit}
    button{cursor:pointer}
    button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
    .wrap{max-width:920px;margin:auto;padding:0 17px}
    .top{position:sticky;top:0;z-index:10;background:rgba(10,24,38,.96);backdrop-filter:blur(15px);border-bottom:1px solid var(--border)}
    .brandline{display:flex;align-items:center;justify-content:space-between;padding:17px 0 13px;gap:12px}
    .brand{display:flex;align-items:center;gap:11px;min-width:0}
    .brandmark{width:40px;height:40px;flex:none;border-radius:12px;color:#17263b;background:linear-gradient(145deg,#ffe7a9,#c99545);display:grid;place-items:center;font-size:23px;font-weight:900;box-shadow:inset 0 0 0 2px #ffffff30}
    .eyebrow{font-size:10px;letter-spacing:.16em;font-weight:800;color:var(--gold);text-transform:uppercase}
    .brand h1{font-family:Georgia,"Yu Mincho",serif;font-size:20px;line-height:1.2;margin:1px 0 0;letter-spacing:.035em;white-space:nowrap}
    .small-pale{color:var(--sub);font-size:12px}
    .nav{display:flex;overflow-x:auto;scrollbar-width:none;gap:5px;padding:0 0 10px}
    .nav::-webkit-scrollbar{display:none}
    .navbtn{white-space:nowrap;border:1px solid transparent;color:var(--sub);border-radius:9px;background:transparent;padding:7px 12px;font-size:13px;font-weight:650}
    .navbtn.active{background:#26394b;color:var(--gold2);border-color:#45576a}
    main{min-height:65vh;padding:24px 0 36px}
    .overline{font-size:11px;font-weight:800;letter-spacing:.15em;color:var(--gold);text-transform:uppercase}
    h2{font-size:24px;letter-spacing:.01em;line-height:1.3;margin:4px 0 7px}
    h3{font-size:16px;margin:0 0 8px}
    p{margin:0 0 14px}
    .subtext{color:var(--sub);font-size:13px}
    .heading{display:flex;justify-content:space-between;gap:10px;align-items:flex-start;margin-bottom:19px}
    .heading-actions{display:flex;gap:7px;flex-wrap:wrap;justify-content:end}
    .btn{border:1px solid #54616e;border-radius:11px;color:var(--text);background:#1d344a;padding:10px 14px;font-weight:720;font-size:13px;white-space:nowrap;display:inline-flex;align-items:center;justify-content:center;gap:6px}
    .btn.primary{color:#192637;border-color:#e7bd72;background:linear-gradient(140deg,#f6dba3,#d6ac61)}
    .btn.ghost{background:transparent;border-color:var(--border);color:var(--sub)}
    .btn.danger{border-color:#814840;background:#40272c;color:#ffc6c2}
    .btn.small{padding:6px 10px;border-radius:8px;font-size:12px}
    .btn:active{transform:translateY(1px)}
    .hero{border:1px solid #5a503c;border-radius:18px;padding:22px;background:radial-gradient(circle at 100% 0%,#3a3a31 0%,transparent 42%),linear-gradient(135deg,#1b3042,#122236);box-shadow:var(--shadow);margin-bottom:19px}
    .hero-title{font-family:Georgia,"Yu Mincho",serif;font-weight:800;font-size:25px;line-height:1.35;margin:7px 0 9px}
    .hero .subtext{max-width:580px}
    .stats{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;margin:0 0 22px}
    .stat{border:1px solid var(--border);border-radius:13px;background:var(--surface);padding:16px}
    .stat .num{font-size:28px;line-height:1.2;font-weight:850;color:var(--gold2);font-variant-numeric:tabular-nums}
    .stat .lbl{font-size:12px;color:var(--sub);margin-top:3px}
    .section-title{display:flex;align-items:center;justify-content:space-between;margin:25px 0 11px}
    .quickgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
    .quick{background:var(--panel);color:var(--text);border:1px solid var(--border);border-radius:13px;padding:14px;text-align:left;min-height:100px}
    .quick strong{display:block;color:var(--gold2);margin:6px 0 4px;font-size:14px}
    .quick small{display:block;color:var(--sub);line-height:1.4;font-size:11px}
    .quick .arrow{float:right;color:var(--gold)}
    .notice{margin:15px 0;border:1px solid #725c40;background:#342d21;border-radius:11px;padding:11px 13px;color:#f6dbb0;font-size:12px}
    .tip{color:var(--sub);font-size:12px;line-height:1.7;margin:16px 0}
    .toolbar{display:flex;gap:8px;flex-wrap:wrap;margin:12px 0 18px}
    .field,.filter{background:#15283a;color:var(--text);border:1px solid #395066;border-radius:11px;padding:11px 12px;min-width:0;width:100%;font-size:14px}
    .toolbar .field{flex:2 1 190px}
    .toolbar .filter{flex:1 1 150px;max-width:100%}
    .recordlist{display:flex;flex-direction:column;gap:9px}
    .record{background:var(--surface);border:1px solid var(--border);border-radius:13px;padding:14px 15px}
    .record-head{display:flex;justify-content:space-between;gap:10px;align-items:start}
    .record-name{font-size:17px;font-weight:780;word-break:break-word}
    .record-meta{font-size:12px;color:var(--sub);margin:4px 0 8px}
    .record-note{font-size:12px;color:#b6c7d7;white-space:pre-wrap;overflow-wrap:anywhere;border-top:1px solid #2d4252;padding-top:7px;margin-top:8px}
    .record-actions{display:flex;gap:5px;flex-shrink:0}
    .tag{font-size:11px;font-weight:750;border-radius:6px;color:#fae2b0;background:#59442a;padding:3px 7px;display:inline-block;margin-right:5px}
    .tag.blue{background:#233f52;color:#addbed}
    .tag.green{background:#244435;color:#a4e5ba}
    .empty{border:1px dashed #41586d;border-radius:15px;text-align:center;padding:38px 18px;background:#1021336b}
    .empty .symbol{font-size:30px;margin-bottom:10px;color:var(--gold)}
    .empty h3{margin-bottom:6px}
    .empty p{color:var(--sub);font-size:13px}
    .foot{font-size:11px;text-align:center;color:var(--muted);padding:17px 0 30px;border-top:1px solid #273b4e}
    .modaloverlay{position:fixed;inset:0;z-index:30;background:#000b;display:flex;align-items:end;justify-content:center}
    .modal{background:#15283a;border:1px solid #42556a;border-radius:20px 20px 0 0;width:min(680px,100%);max-height:93dvh;overflow:auto;padding:20px 20px calc(19px + env(safe-area-inset-bottom));box-shadow:0 -10px 60px #0008;overscroll-behavior:contain}
    .modal-top{display:flex;justify-content:space-between;align-items:center;gap:12px;border-bottom:1px solid #3a5065;padding-bottom:12px;margin-bottom:16px}
    .modal-top h2{font-size:20px;margin:0}
    .iconbtn{height:34px;width:34px;color:var(--text);background:#22394e;border:1px solid #425971;border-radius:8px;font-size:21px}
    .formgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
    .fgroup{display:flex;flex-direction:column;gap:5px;font-size:12px;font-weight:720;color:#d0dce7}
    .fgroup.wide{grid-column:1/-1}
    .fgroup input,.fgroup textarea,.fgroup select{color:#fff;width:100%;min-width:0;background:#091c2c;border:1px solid #4a6278;border-radius:9px;padding:11px 11px;font-size:14px;outline-offset:0}
    .fgroup input::placeholder,.fgroup textarea::placeholder{color:#71869c}
    .fgroup textarea{min-height:72px;resize:vertical}
    .fgroup .help{font-weight:400;color:var(--sub);font-size:11px}
    .formfoot{display:flex;justify-content:flex-end;gap:8px;margin-top:18px;position:sticky;bottom:-20px;padding:10px 0;background:#15283a}
    .sep{border:0;border-top:1px solid var(--border);margin:22px 0}
    .settingbox{background:var(--surface);border:1px solid var(--border);padding:18px;border-radius:14px;margin:12px 0}
    .settingbox p{color:var(--sub);font-size:13px}
    .settingbox .buttons{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
    .pillnum{font-variant-numeric:tabular-nums;color:var(--blue);font-size:12px}
    .status-line{font-size:11px;color:var(--sub);display:flex;align-items:center;gap:5px}
    .dot{height:7px;width:7px;background:var(--green);border-radius:50%;display:inline-block;flex-shrink:0}
    .dot.warn{background:var(--red)}
    .toast{position:fixed;bottom:calc(20px + env(safe-area-inset-bottom));left:50%;transform:translateX(-50%);z-index:70;background:#e3f1e7;color:#123026;padding:12px 16px;border-radius:11px;box-shadow:var(--shadow);font-weight:740;font-size:13px;min-width:180px;text-align:center;pointer-events:none}
    @media(min-width:640px){.brand h1{font-size:23px}.stats{grid-template-columns:repeat(5,minmax(0,1fr))}.quickgrid{grid-template-columns:repeat(3,minmax(0,1fr))}.modaloverlay{align-items:center}.modal{border-radius:19px;max-height:90vh;padding-bottom:18px}}
    @media(max-width:390px){.brand h1{font-size:18px}.heading{flex-wrap:wrap}.heading-actions{justify-content:start}.formgrid{column-gap:8px}.fgroup input,.fgroup select{padding:10px 8px}}
    @media(prefers-reduced-motion:no-preference){.quick,.record,.btn{transition:border-color .15s,transform .15s}.quick:hover{border-color:var(--gold)}}

    .cloudbox{border-color:#4b705f}
    .cloud-state{display:flex;align-items:center;gap:9px;color:#e1f5e5;margin:4px 0 11px}
    .cloud-light{width:10px;height:10px;border-radius:50%;background:#c7a569;flex:none}
    .cloud-light.ok{background:#82db9e}.cloud-light.warn{background:#ffae8d}
    .authform{display:flex;flex-direction:column;gap:12px;margin:12px 0}
    .authform .fgroup{max-width:430px}
    .authform .btn{align-self:flex-start}
    /* Season-first standings */
    .seasonbar{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin:12px 0 15px}
    .league-tabs{display:flex;gap:8px;overflow:auto;scrollbar-width:none;padding-bottom:7px;margin-bottom:12px}
    .league-chip{flex:none;border:1px solid #3c5265;background:#14293e;border-radius:11px;color:#d8e4ec;padding:11px 13px;font-weight:750;font-size:12px;text-align:left;max-width:215px}
    .league-chip.on{border-color:#c6a05d;background:#342f2a;color:#ffdfa1}
    .league-chip small{display:block;color:var(--sub);font-weight:500}
    .season-list{display:flex;gap:8px;flex-wrap:wrap;margin:12px 0 22px}
    .season-link{background:#192f44;color:#f1f5f8;border:1px solid #425a70;border-radius:10px;padding:10px 13px;font-size:13px;font-weight:750}
    .season-link:hover{border-color:var(--gold)}
    .season-form{display:flex;gap:7px;align-items:center;margin:16px 0 20px;flex-wrap:wrap}
    .season-form .field{width:140px;flex:0 1 160px}
    .season-header{display:flex;align-items:flex-start;justify-content:space-between;gap:10px;flex-wrap:wrap;margin-bottom:10px}
    .season-header h2{font-family:Georgia,'Yu Mincho',serif;color:var(--gold2)}
    .summary-strip{display:flex;gap:8px;flex-wrap:wrap;margin:12px 0 18px}
    .summary-pill{background:#142b40;border:1px solid #304d62;padding:8px 10px;border-radius:9px;font-size:12px;color:var(--sub)}
    .summary-pill strong{font-size:16px;color:#f5e1b8;margin-right:3px}
    .tab-controls{display:flex;gap:7px;flex-wrap:wrap;margin:19px 0 10px}
    .section-label{font-size:16px;font-weight:780;margin:24px 0 9px}
    .table-scroll{border:1px solid #3b5165;border-radius:14px;overflow:auto;max-width:100%;background:#102235;overscroll-behavior-x:contain}
    .standings{border-collapse:separate;border-spacing:0;min-width:max-content;width:100%;font-variant-numeric:tabular-nums;font-size:12px}
    .standings th,.standings td{white-space:nowrap;vertical-align:middle;text-align:center;border-bottom:1px solid #294356;border-right:1px solid #294356;padding:8px 9px;height:46px}
    .standings thead th{position:sticky;top:0;z-index:2;background:#1e374d;color:#c5d3df;font-size:11px}
    .standings tbody tr:last-child td{border-bottom:none}
    .standings .pin-rank{position:sticky;left:0;z-index:3;background:#13293e;min-width:40px;width:40px;box-shadow:2px 0 4px #0915234a}
    .standings .pin-name{position:sticky;left:40px;z-index:3;background:#13293e;min-width:112px;max-width:168px;text-align:left;box-shadow:3px 0 5px #09152358}
    .standings thead .pin-rank,.standings thead .pin-name{z-index:5;background:#244056}
    .standings .pin-name button{background:transparent;border:0;color:#f9e2b1;padding:0;font-weight:770;text-align:left;white-space:normal;line-height:1.4;font-size:12px}
    .standings tr:nth-child(even) .pin-rank,.standings tr:nth-child(even) .pin-name{background:#1a3044}
    .standings td.result-cell{padding:2px 3px;min-width:77px}
    .result-cell button{border:1px solid transparent;background:transparent;border-radius:7px;padding:4px 5px;min-width:66px;min-height:38px;color:var(--sub)}
    .result-cell button .opp{display:block;font-size:10px;font-weight:550;line-height:1.2;max-width:74px;overflow:hidden;text-overflow:ellipsis}
    .result-cell button .mark{display:block;line-height:1.1;font-weight:900;font-size:18px}
    .result-cell .won{background:#113f55;color:#9fe0f9;border-color:#275a74}
    .result-cell .lost{background:#4d2937;color:#ffb0ad;border-color:#713e4b}
    .result-cell .drew{background:#35404c;color:#d5dbe2;border-color:#515e6c}
    .result-cell .pending{background:#25394a;color:#a6c0d1;border-color:#41566b}
    .won-text{color:#88dbf7;font-weight:850}
    .lost-text{color:#ffaaa4;font-weight:850}
    .drew-text{color:#e1d5ad;font-weight:850}
    .pending-text{color:#a6c0d1;font-weight:750}
    .mutedcell{color:#6c8398}
    .row-result{color:var(--sub);font-size:11px;max-width:100px;overflow:hidden;text-overflow:ellipsis}
    .score-strong{font-weight:850;color:#f3f6f9}
    .micro{font-size:10px;color:var(--sub);font-weight:500}
    .legend{display:flex;flex-wrap:wrap;gap:12px;color:var(--sub);font-size:11px;margin:8px 2px 14px}
    .game-line{display:grid;grid-template-columns:44px 1fr auto;align-items:center;gap:6px;padding:10px 4px;border-bottom:1px solid #294356;font-size:12px}
    .game-line:last-child{border-bottom:0}
    .game-list{background:var(--surface);border:1px solid var(--border);border-radius:13px;padding:0 12px;margin:9px 0}
    .round-tag{font-size:11px;color:var(--gold)}
    .match-score{font-weight:750}
    .mini-actions{display:flex;gap:4px}
    .mini-actions .btn{padding:5px 7px}
    .mini-note{padding:11px 13px;border:1px solid #536477;border-radius:10px;background:#1b3042;font-size:12px;color:#c9d8e4;margin:10px 0}
    .table-hint{font-size:11px;color:var(--sub);margin:5px 0 10px}
    .compact-num{color:var(--gold2);font-size:12px}
    .subhead{font-size:12px;color:var(--sub);margin:4px 0 11px}
    .row-foot{display:flex;gap:8px;align-items:center;justify-content:space-between;flex-wrap:wrap}
    @media(max-width:450px){.game-line{grid-template-columns:36px 1fr auto}.mini-actions .btn{padding:5px}.seasonbar .btn{padding:8px 10px}}

    /* v0.4 opening rank, final rank, compact 11-round no horizontal scrolling */
    .standings .pin-final{position:sticky;left:34px;z-index:3;background:#13293e;min-width:34px;width:34px;box-shadow:2px 0 4px #0915234a}
    .standings .pin-rank{min-width:34px;width:34px}
    .standings .pin-name{left:68px;min-width:112px}
    .standings thead .pin-final{z-index:5;background:#244056}
    .standings tr:nth-child(even) .pin-final{background:#1a3044}
    .view-controls{display:flex;align-items:center;flex-wrap:wrap;gap:7px;margin:8px 0 12px}
    .view-controls .filter{width:auto;min-width:145px;max-width:100%;padding:7px 9px}
    .view-controls .btn{padding:8px 10px}
    .view-controls .btn.selected{border-color:#d9b87e;background:#41382c;color:#ffdfad}
    .compact-board{width:100%;border:1px solid #40576b;border-radius:11px;overflow:hidden;background:#102235}
    .compact-row{display:grid;grid-template-columns:19px 19px minmax(84px,1.5fr) 38px repeat(var(--col-count),minmax(0,1fr));min-width:0;align-items:center}
    .compact-row>*{min-width:0;overflow:hidden;text-overflow:clip;display:flex;justify-content:center;align-items:center;height:32px;border-right:1px solid #273e50;border-bottom:1px solid #273e50}
    .compact-row>*:last-child{border-right:0}
    .compact-row:last-child>*{border-bottom:0}
    .compact-row:nth-child(2n+1):not(.compact-head){background:#192e42}
    .compact-head{background:#294259;color:#dce9f6;font-size:9px;font-weight:800}
    .compact-head>*{height:29px}
    .compact-row .compact-name{justify-content:flex-start;padding:0 2px}
    .compact-name button{font-size:11px;color:#fce4b8;line-height:1.1;border:0;background:none;font-weight:700;width:100%;text-align:left;padding:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
    .compact-rank{color:#d3e3ef;font-size:11px;font-variant-numeric:tabular-nums}
    .compact-score{font-size:10px;color:#f5e4be;letter-spacing:-.4px;font-weight:800;white-space:nowrap}
    .compact-mark{font-size:13px;line-height:1;width:100%;height:30px;padding:0;border:0;background:transparent;color:#6c8197;font-weight:850;border-radius:0;touch-action:manipulation}
    .compact-mark.won{background:#113e53;color:#90e0f9}.compact-mark.lost{background:#4a2937;color:#ffb0b0}.compact-mark.drew{background:#414348;color:#ebdfc1}.compact-mark.pending{background:#263a4b;color:#a6c0d1}
    .compact-mark:focus-visible{outline:2px solid #f9df97;outline-offset:-2px}
    .compact-head .roundnum{font-size:9px;white-space:nowrap}
    .compact-board.has-many .compact-row{grid-template-columns:18px 18px minmax(62px,1.5fr) 34px repeat(var(--col-count),minmax(0,1fr))}
    .compact-board.has-many .compact-mark{font-size:11px}
    .fullscreenstand-overlay{align-items:stretch;padding:0;z-index:80}
    .fullscreenstand{background:#0b1c2b;color:var(--text);height:100dvh;width:100vw;max-width:none;overflow:auto;padding:calc(18px + env(safe-area-inset-top)) 8px calc(22px + env(safe-area-inset-bottom))}
    .fullscreenstand h2{font-size:17px}
    .fullscreen-head{display:flex;justify-content:space-between;align-items:flex-start;gap:9px;margin-bottom:12px;padding:0 4px}
    .fullscreenstand .compact-row>*{height:34px}
    .fullscreenstand .compact-head>*{height:30px}
    .fullscreenstand .compact-name button{font-size:11px;letter-spacing:-.4px}
    .compact-legend{color:#b0c5d7;font-size:11px;line-height:1.5;margin:7px 2px 11px}
    @media(max-width:375px){.compact-row{grid-template-columns:18px 18px minmax(66px,1.5fr) 34px repeat(var(--col-count),minmax(0,1fr))}.compact-row .compact-name button{font-size:10px}.compact-head{font-size:8px}.compact-row .compact-score{font-size:9px}.compact-mark{font-size:12px}}

    /* Career totals – phone-first cards with no sideways table scrolling. */
    .career-filters{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:12px;margin:16px 0}
    .career-filters label{display:flex;flex-direction:column;gap:7px;color:var(--sub);font-size:12px}
    .career-filters select{width:100%;min-width:0}
    .career-summary{grid-template-columns:repeat(3,minmax(0,1fr))}
    .career-summary .num{font-size:clamp(20px,5vw,30px)}
    .career-board{display:grid;gap:8px;margin:12px 0 20px}
    .career-player{border:1px solid var(--border);background:var(--surface);border-radius:12px;color:var(--text);padding:12px;display:flex;width:100%;gap:10px;text-align:left;align-items:center}
    .career-player.on{border-color:var(--gold);background:var(--panel)}
    .career-place{color:var(--sub);font-weight:700;font-variant-numeric:tabular-nums;flex:0 0 22px;text-align:center}
    .career-who{min-width:0;flex:1;display:grid;gap:4px}
    .career-who strong{font-size:14px;overflow-wrap:anywhere}
    .career-who small,.career-record small,.career-period small{color:var(--sub);font-size:11px;line-height:1.45}

async function saveBulkMatches(form){
 const {league,term}=currentSeason,raw=new FormData(form).get('rows')||'',lines=raw.split(/\r?\n/).filter(x=>x.trim());
 if(!lines.length)throw Error('少なくとも1行入力してください');
 const parsed=[];
 const existingNames=new Set(seasonMatches(league,term).map(m=>pairKey(getName(m.playerAId).toLowerCase(),getName(m.playerBId).toLowerCase(),m.round)));
 const incoming=new Set();
 for(let i=0;i<lines.length;i++){
  const vals=parseLine(lines[i]);if(['回戦','round'].includes(normalize(vals[0]).toLowerCase()))continue;
  const [rnd,first,second,win='',type='']=vals.map(x=>normalize(x));
  if(!rnd||!first||!second||normalize(first).toLowerCase()===normalize(second).toLowerCase())throw Error(`${i+1}行目：回戦と異なる2人の名前を確認してください`);
  const winKey=win.toLowerCase();
  let chosen;
  if(['未対戦','未定','pending','予定','-',''].includes(winKey))chosen='pending';
  else if(['引分','引き分け','draw','△','='].includes(winKey))chosen='draw';
  else if(['a','○','1'].includes(winKey)||winKey===first.toLowerCase())chosen='a';
  else if(['b','●','2'].includes(winKey)||winKey===second.toLowerCase())chosen='b';
  else throw Error(`${i+1}行目：勝者「${win}」は対戦者と一致しません`);
  if(type&&!['通常','normal','不戦','不戦勝','forfeit'].includes(type.toLowerCase()))throw Error(`${i+1}行目：種別は通常・不戦のみ対応しています`);
  const key=pairKey(first.toLowerCase(),second.toLowerCase(),rnd);
  if(incoming.has(key)||existingNames.has(key))throw Error(`${i+1}行目：同じ回戦・対戦が重複しています`);
  incoming.add(key);parsed.push({round:rnd,first,second,chosen,kind:chosen==='pending'?'pending':chosen==='draw'?'draw':['不戦','不戦勝','forfeit'].includes(type.toLowerCase())?'forfeit':'normal'});
 }
 if(!parsed.length)throw Error('登録する対戦がありません');
 let added=0;
 for(const r of parsed){
  const a=ensurePerson(r.first),b=ensurePerson(r.second),winner=r.chosen==='draw'||r.chosen==='pending'?null:r.chosen==='a'?a:b;
  if(!db.leagues.some(p=>p.league===league&&normalize(p.term)===term&&p.personId===a))db.leagues.push({id:uid(),league,term,personId:a,rank:'',wins:'',losses:'',draws:'',result:'',notes:'',createdAt:new Date().toISOString(),updatedAt:new Date().toISOString()});
  if(!db.leagues.some(p=>p.league===league&&normalize(p.term)===term&&p.personId===b))db.leagues.push({id:uid(),league,term,personId:b,rank:'',wins:'',losses:'',draws:'',result:'',notes:'',createdAt:new Date().toISOString(),updatedAt:new Date().toISOString()});
  db.matches.push({id:uid(),league,term,round:r.round,playerAId:a,playerBId:b,winnerId:winner,outcome:r.kind,notes:'',createdAt:new Date().toISOString(),updatedAt:new Date().toISOString()});added++;
 }
 await persist();closeModal();render();toast(`${added}局を登録しました`);
}

const f=(key,label,value='',opts={})=>{
 const {required=false,wide=false,placeholder='',kind='text',help='',options=null}=opts;
 const val=value==null?'':String(value);
 let input= options?`<select name="${key}" ${required?'required':''}>${options.map(([v,t])=>`<option value="${attr(v)}" ${v===val?'selected':''}>${esc(t)}</option>`).join('')}</select>`:kind==='textarea'?`<textarea name="${key}" placeholder="${attr(placeholder)}">${esc(val)}</textarea>`:`<input name="${key}" type="${kind}" ${kind==='number'?'min="0" step="1"':''} value="${attr(val)}" placeholder="${attr(placeholder)}" ${required?'required':''} ${key==='person'?'list="known-people" autocomplete="off"':''}>`;
 return `<label class="fgroup ${wide?'wide':''}"><span>${esc(label)}${required?' *':''}</span>${input}${help?`<span class="help">${esc(help)}</span>`:''}</label>`;
};

async function saveForm(form){
 const kind=form.dataset.kind,id=form.dataset.id,values=Object.fromEntries(new FormData(form));
 const old=id?db[kind].find(r=>r.id===id):null;
 const record={...(old||{}),id:id||uid(),createdAt:old?.createdAt||new Date().toISOString(),updatedAt:new Date().toISOString()};
 if(kind==='people'){
  const name=normalize(values.person);if(!name)return alert('人物名を入力してください');
  if(db.people.some(p=>p.id!==id&&normalize(p.name).toLowerCase()===name.toLowerCase()))return alert('この人物名はすでに登録されています');
  record.name=name;
 } else {
  record.personId=ensurePerson(values.person);
  if(kind==='titles'){record.title=normalize(values.title);record.edition=normalize(values.edition);record.start=values.start;record.end=values.end;record.defenses=values.defenses;record.notes=values.notes.trim()}
  if(kind==='tournaments'){record.tournament=normalize(values.tournament);record.edition=normalize(values.edition);record.year=values.year;record.notes=values.notes.trim()}
  if(kind==='leagues'){
   if(old&&db.matches.some(m=>m.league===old.league&&normalize(m.term)===normalize(old.term)&&(m.playerAId===old.personId||m.playerBId===old.personId))&&(values.league!==old.league||normalize(values.term)!==normalize(old.term)||record.personId!==old.personId))return alert('この選手には登録済み対戦があります。リーグ・期・人物名の変更はできません。人物の改名は「人物名簿」から行えます。');
   record.league=values.league;record.term=normalize(values.term);record.startRank=values.startRank;record.rank=values.rank;record.wins=values.wins;record.losses=values.losses;record.draws=values.draws;record.result=normalize(values.result);record.notes=values.notes.trim();
   if(db.leagues.some(x=>x.id!==record.id&&x.league===record.league&&normalize(x.term)===record.term&&x.personId===record.personId))return alert('この人物・期・リーグの記録は登録済みです。既存の記録を編集してください。');
  }
  if(kind==='officers'){record.term=normalize(values.term);record.role=normalize(values.role);record.affiliation=normalize(values.affiliation);record.start=values.start;record.end=values.end;record.notes=values.notes.trim()}
 }
 if(old)Object.assign(old,record);else db[kind].push(record);
 await persist();closeModal();render();toast(id?'変更を保存しました':'登録しました');
}

function parseLine(s){
 const sep=s.includes('\t')?'\t':',';const out=[];let val='',inQ=false;
 for(let i=0;i<s.length;i++){
  const c=s[i];if(c==='"'){if(inQ&&s[i+1]==='"'){val+='"';i++}else inQ=!inQ}
  else if(c===sep&&!inQ){out.push(val.trim());val=''}else val+=c;
 }
 out.push(val.trim());return out;
}
async function saveBulk(form){
 const v=Object.fromEntries(new FormData(form)),term=normalize(v.term);if(!term)return alert('期数が必要です');
 let added=0,skipped=0;const rows=v.rows.split(/\r?\n/).filter(x=>x.trim());
 for(const line of rows){
  const vals=parseLine(line);
  let name='',startRank='',rank='',wins='',losses='',result='',notes='';
  if(v.mode==='legacy') [name,rank='',wins='',losses='',result='',notes='']=vals;
  else [name,startRank='',rank='',wins='',losses='',result='',notes='']=vals;
  if(!name||['氏名','人物名','名前'].includes(name)){skipped++;continue}
  const personId=ensurePerson(name);
  if(db.leagues.some(x=>x.personId===personId&&normalize(x.term)===term&&x.league===v.league)){skipped++;continue}
  db.leagues.push({id:uid(),league:v.league,term,personId,startRank,rank,wins,losses,draws:'',result,notes,createdAt:new Date().toISOString(),updatedAt:new Date().toISOString()});added++;
 }
 await persist();closeModal();goSeason(v.league,term);toast(`${added}件を追加 / ${skipped}件スキップ`);
}
function exportFile(name,contents,type){

}
function exportData(k){

 const fields={matches:['リーグ','期数','回戦','選手A','選手B','勝者','決着種別','備考'],people:['人物名','登録日時'],titles:['タイトル','期数','保持者','開始日','終了日','防衛回数','備考'],tournaments:['大会','回・期','開催年','優勝者','備考'],leagues:['リーグ区分','登録区分','期数','人物名','開幕順位','最終順位','勝','敗','分','結果','備考'],officers:['期・任期','役職','人物名','所属','就任日','退任日','備考']};
 const map={matches:r=>[leagueDisplay(r.league,r.term),r.term,r.round,getName(r.playerAId),getName(r.playerBId),r.outcome==='pending'?'未対戦':r.winnerId?getName(r.winnerId):'引分',r.outcome,r.notes],people:p=>[p.name,p.createdAt],titles:r=>[r.title,r.edition,getName(r.personId),r.start,r.end,r.defenses,r.notes],tournaments:r=>[r.tournament,r.edition,r.year,getName(r.personId),r.notes],leagues:r=>[leagueDisplay(r.league,r.term),(LEAGUES.find(x=>x[0]===r.league)||[])[1]||r.league,r.term,getName(r.personId),r.startRank||'',r.rank,r.wins,r.losses,r.draws,r.result,r.notes],officers:r=>[r.term,r.role,getName(r.personId),r.affiliation,r.start,r.end,r.notes]};
 const quote=x=>`"${String(x??'').replace(/"/g,'""')}"`;
 const csv='\ufeff'+[fields[k],...db[k].map(map[k])].map(row=>row.map(quote).join(',')).join('\r\n');
 exportFile(`競技史DB_${k==='matches'?'対戦結果':VIEW_NAMES[k]}_${date}.csv`,csv,'text/csv;charset=utf-8');toast('CSVを書き出しました');
}
async function importData(file){

 try{
  const data=JSON.parse(await file.text());if(!verifyState(data))throw Error('このアプリ用の形式ではありません');
  if(!confirm('現在の全記録を置き換えます。バックアップ済みですか？'))return;
  db=upgradeState(data);await persist();view='home';search='';leagueFilter='all';termFilter='';render();toast('バックアップを復元しました');
 }catch(err){alert('読み込みに失敗しました：'+err.message)}finally{$('#import-file').value=''}
}
async function removeRecord(k,id){
 const record=db[k].find(r=>r.id===id);if(!record)return;
 if(k==='people'&&countPerson(id)>0)return alert('この人物には関連記録があります。先に関連記録を削除するか、人物名を編集してください。');
 if(k==='leagues'&&db.matches.some(m=>m.league===record.league&&normalize(m.term)===normalize(record.term)&&(m.playerAId===record.personId||m.playerBId===record.personId)))return alert('この参加者の対戦記録が残っています。先に対戦結果を削除してください。');
 if(!confirm(`${k==='people'?record.name:getName(record.personId)} の記録を削除しますか？`))return;
 db[k]=db[k].filter(r=>r.id!==id);await persist();render();toast('削除しました');
}
